name: Verilog CI

on:
  push:
    branches: [ main, c-reference ]
  pull_request:
    branches: [ main ]

jobs:
  lms-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc

      - name: Run self-checking LMS simulation
        run: make test

      - name: Run C reference model
        run: make reference

      - name: Run LMS step-size experiment
        run: make experiment
