name: Verilog CI

on:
  push:
    branches: [ main, c-reference ]
  pull_request:
    branches: [ main ]

jobs:
  lms-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc yosys nextpnr-ecp5

      - name: Run self-checking LMS simulation
        run: make test

      - name: Run C reference model
        run: make reference

      - name: Run LMS step-size experiment
        run: make experiment

      - name: Run acoustic ANC and path-change simulation
        run: make anc-experiment

      - name: Run bit-exact acoustic-vector RTL parity
        run: make rtl-parity

      - name: Run serialized one-multiplier RTL parity
        run: make serial-parity

      - name: Run staged-parallel RTL parity
        run: make pipelined-parity

      - name: Run buffered stream parity under backpressure
        run: make stream-parity

      - name: Run 48 kHz stream cadence test
        run: make stream-48k

      - name: Run 16-bit stereo I2S ingress parity
        run: make i2s-ingress

      - name: Run I2S blocked-consumer overrun test
        run: make i2s-overrun

      - name: Run I2S TX underrun test
        run: make i2s-tx

      - name: Run full-duplex I2S LMS parity
        run: make i2s-full-duplex

      - name: Check I2S ingress synthesizability
        run: make i2s-synth-check

      - name: Check full-duplex I2S synthesizability
        run: make i2s-full-synth-check

      - name: Compare parallel and serialized synthesis
        run: make synthesis-report

      - name: ECP5 synthesis, place and route
        run: make ecp5-implementation
